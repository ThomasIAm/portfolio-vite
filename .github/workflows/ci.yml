name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build with bundled sample content: no Contentful/Cloudflare secrets in CI.
      USE_SAMPLE_CONTENT: "true"
    steps:
      # Actions pinned to commit SHAs; Dependabot keeps them updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # No dependency install scripts: blocks malicious postinstall hooks. Tests and build don't need them.
      - run: npm ci --ignore-scripts
      # SonarSource rules are skipped here: SonarCloud already reviews PRs.
      - run: npm run lint
        env:
          SKIP_SONARJS: "true"
      - run: npm test
      - run: npm run build
