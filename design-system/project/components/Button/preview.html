<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet"><style>body{margin:0;padding:20px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.b{font:500 14px/20px var(--font-sans);height:44px;padding:0 24px;border-radius:var(--radius-lg);border:0;cursor:pointer;color:var(--foreground);background:none;transition:all .3s}
.b:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.d{background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-soft)}.d:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.w{background:linear-gradient(135deg,var(--primary),var(--secondary));color:var(--primary-foreground);box-shadow:var(--shadow-soft)}
.s{background:var(--secondary);color:var(--secondary-foreground)}.o{border:2px solid color-mix(in srgb,var(--primary) 20%,transparent)}
.g:hover{background:var(--muted)}.l{color:var(--primary);padding:0}.x{background:var(--destructive);color:var(--destructive-foreground)}
.sm{height:36px;padding:0 16px;font-size:12px;border-radius:var(--radius-md)}.lg{height:48px;padding:0 32px;font-size:16px;border-radius:var(--radius-xl)}</style>
<div class="row"><button class="b d">Default</button><button class="b w">Warm</button><button class="b s">Secondary</button><button class="b o">Outline</button><button class="b g">Ghost</button><button class="b l">Link</button><button class="b x">Destructive</button></div>
<div class="row" style="margin-top:12px"><button class="b d sm">Small</button><button class="b d">Default</button><button class="b d lg">Large</button></div>
